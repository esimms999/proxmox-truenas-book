project:
  type: book
  output-dir: _book

book:
  title: "TrueNAS SCALE on Proxmox"
  subtitle: "HBA and GPU passthrough from BIOS to a running pool"
  author: "Eric"
  date: today
  chapters:
    - index.qmd
    - part: "Server 1"
      chapters:
        - server1/01-overview.qmd
        - server1/02-bios.qmd
        - server1/03-install-proxmox.qmd
        - server1/04-iommu.qmd
        - server1/05-identify-hba.qmd
        - server1/06-vfio.qmd
        - server1/07-create-vm.qmd
        - server1/08-passthrough.qmd
        - server1/09-gpu-passthrough.qmd
        - server1/10-truenas.qmd
        - server1/11-troubleshooting.qmd
        - server1/12-reference.qmd
    - part: "Server 2"
      chapters:
        - server2/00-overview.qmd
  repo-url: https://github.com/esimms999/proxmox-truenas-book
  sidebar:
    style: docked
    search: true
  page-navigation: true
  repo-actions: [source, issue]

format:
  html:
    theme:
      light: [cosmo, custom.scss]
      dark: [darkly, custom.scss]
    toc: true
    toc-depth: 3
    number-sections: true
    code-copy: true
    code-overflow: wrap
    link-external-newwindow: true
    smooth-scroll: true
  pdf:
    documentclass: book
    toc: true
    number-sections: true
  epub:
    toc: true

execute:
  echo: true
  eval: false
  freeze: auto
