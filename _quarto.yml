project:
  type: book
  output-dir: _book

book:
  title: "TrueNAS SCALE on Proxmox"
  subtitle: "HBA and GPU passthrough from BIOS to a running pool"
  author: "Eric"
  date: today
  chapters:
    - index.qmd
    - 01-overview.qmd
    - 02-bios.qmd
    - 03-install-proxmox.qmd
    - 04-iommu.qmd
    - 05-identify-hba.qmd
    - 06-vfio.qmd
    - 07-create-vm.qmd
    - 08-passthrough.qmd
    - 09-gpu-passthrough.qmd
    - 10-truenas.qmd
    - 11-troubleshooting.qmd
    - 12-reference.qmd
  repo-url: https://github.com/esimms999/proxmox-truenas-book
  sidebar:
    style: docked
    search: true
  page-navigation: true
  repo-actions: [source, issue]

format:
  html:
    theme:
      light: [cosmo, custom.scss]
      dark: [darkly, custom.scss]
    toc: true
    toc-depth: 3
    number-sections: true
    code-copy: true
    code-overflow: wrap
    link-external-newwindow: true
    smooth-scroll: true
  pdf:
    documentclass: book
    toc: true
    number-sections: true
  epub:
    toc: true

execute:
  echo: true
  eval: false
  freeze: auto
